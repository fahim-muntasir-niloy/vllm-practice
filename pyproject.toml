[project]
name = "vllm-app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.42",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "langchain-monty>=4.0.0",
    "langchain-openai>=1.8.0",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "uvicorn>=0.54.0",
    # vLLM only runs on Linux. On Windows, install and run it inside WSL2.
    "vllm==0.33.0; sys_platform == 'linux'",
]
